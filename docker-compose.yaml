# HK SFC POC - 完整独立环境 (MO + Catalog + Workers)
#
# 用法:
#   1. 先确保 moi-core 镜像已构建: cd ../matrixflow/moi-core && make build-images-demo
#   2. 启动: docker compose up -d
#   3. 初始化: bash scripts/04_init_poc_env.sh
#
# 端口:
#   - MO:      16002
#   - Catalog: 8082

services:
  mo:
    image: matrixorigin/matrixone:3.0.8
    container_name: hk-poc-mo
    ports:
      - "16002:6001"
    volumes:
      - poc_mo_data:/mo-data
    restart: on-failure

  catalog:
    image: matrixflow/moi-catalog:poc-fix
    container_name: hk-poc-catalog
    ports:
      - "8084:8081"
    environment:
      MOI_CONFIG_PATH: /etc/moi-catalog/config.toml
      MOI_SYSTEM_API_KEY: ${MOI_SYSTEM_API_KEY:-}
    volumes:
      - ./config/catalog.toml:/etc/moi-catalog/config.toml:ro
      - poc_catalog_data:/data
    depends_on:
      - mo
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  go-worker:
    image: matrixflow/moi-go-worker:latest
    container_name: hk-poc-go-worker
    environment:
      MOI_ENDPOINT: http://catalog:8081
      MOI_WORKER_API_KEY: ${MOI_SYSTEM_API_KEY:-}
      MOI_WORKER_ID: poc-go-worker
    depends_on:
      - catalog
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  python-worker:
    image: matrixflow/moi-python-worker:latest
    container_name: hk-poc-python-worker
    environment:
      PYTHONPATH: /app/workers/python-worker
      MOI_ENDPOINT: http://catalog:8081
      MOI_WORKER_API_KEY: ${MOI_SYSTEM_API_KEY:-}
      MOI_WORKER_ID: poc-python-worker
    depends_on:
      - catalog
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: on-failure

  app:
    build: .
    image: hk-poc-app:latest
    container_name: hk-poc-app
    ports:
      - "3000:3000"
    environment:
      MOI_SYSTEM_API_KEY: ${MOI_SYSTEM_API_KEY:-}
      POC_WORKSPACE_ID: ${POC_WORKSPACE_ID:-}
      STATIC_DIR: /app/web/dist
      SERVER_PORT: "3000"
    depends_on:
      - catalog
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

volumes:
  poc_mo_data: {}
  poc_catalog_data: {}
