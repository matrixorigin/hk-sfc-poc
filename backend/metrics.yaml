  # ====================================================================
  # 4. 连续高于 MA 天数 + 起始日
  # ====================================================================
  - column: ms_t_stk_sis.consecutive_above_ma3
    name: 连续高于 MA3 天数
    explain: |
      到该 trade_date 为止，SICLSE 连续高于当日 ma_3 的天数（含当天）。
      一旦某日收盘 ≤ ma_3，streak 归零。
      查询用法：每只股票通常用 ROW_NUMBER() 取每只股票的最长 streak 一行。
    code: |
      # 逐行扫描；遇到换股票就重置
      if ma3 is not None and close is not None and close > ma3:
          if streak3 == 0:
              start3 = date              # 记录起始日
          streak3 += 1
      else:
          streak3 = 0
          start3 = None
    source: scripts/02_import_data.sh#L398-L403

  - column: ms_t_stk_sis.consecutive_above_ma3_start
    name: 连续高于 MA3 起始日
    explain: |
      consecutive_above_ma3 当前 streak 开始那一天的 trade_date。
      与 consecutive_above_ma3 配对使用，定位连涨段的起点。
    code: |
      if streak3 == 0:
          start3 = date     # 新 streak 开始时记录
      # streak 中断时 start3 = None
    source: scripts/02_import_data.sh#L398-L403

