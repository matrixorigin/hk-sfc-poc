  # ====================================================================
  # 5. 30 日平均成交量（Avg_Vol_30_Pre 客户口径）
  # ====================================================================
  - column: ms_t_stk_sis.avg_vol_30d
    name: 30日平均成交量
    explain: |
      当天**之前**最近 30 个交易日成交量的平均值（不包含当天本身，
      避免用未来信息）。如果这 30 天内有效数据不足 20 天，本列为空。
      常用于判断成交量异常——例如当日成交量超过本列 3 倍即视为放量。
      对应客户口径 Avg_Vol_30_Pre。
    code: |
      # 先用旧 buffer 算出 avg_vol（不含当天）
      if vol_count >= 20:
          avg_vol = vol_sum / vol_count
      else:
          avg_vol = None

      # 计算之后再把当天 vol 推入 buffer（保证 shift(1) 语义）
      vol_buf.append(vol)
      if vol is not None:
          vol_sum += vol; vol_count += 1
      if len(vol_buf) > 30:
          old = vol_buf.popleft()
          if old is not None:
              vol_sum -= old; vol_count -= 1
    source: scripts/02_import_data.sh#L417-L432
