  # ====================================================================
  # 4. 连续高于 MA 天数 + 起始日
  # ====================================================================
  - column: ms_t_stk_sis.consecutive_above_ma3
    name: 连续高于 MA3 天数
    explain: |
      截至当天，收盘价连续高于 3 日均价的天数（含当天）。
      哪天收盘价跌到 3 日均价或以下，计数归零，下次再涨过会重新开始。
    code: |
      # 逐行扫描；遇到换股票就重置
      if ma3 is not None and close is not None and close > ma3:
          if streak3 == 0:
              start3 = date              # 记录起始日
          streak3 += 1
      else:
          streak3 = 0
          start3 = None
    source: scripts/02_import_data.sh#L398-L403

  - column: ms_t_stk_sis.consecutive_above_ma3_start
    name: 连续高于 MA3 起始日
    explain: |
      当前这段「连续高于 3 日均价」是从哪一天开始的。
      和「连续高于 MA3 天数」配对使用，能直接定位连涨段的起点。
    code: |
      if streak3 == 0:
          start3 = date     # 新 streak 开始时记录
      # streak 中断时 start3 = None
    source: scripts/02_import_data.sh#L398-L403

