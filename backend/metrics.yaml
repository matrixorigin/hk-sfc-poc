  # ====================================================================
  # 5. 30 日平均成交量（Avg_Vol_30_Pre 客户口径）
  # ====================================================================
  - column: ms_t_stk_sis.avg_vol_30d
    name: 30日平均成交量
    explain: |
      前 30 个交易日成交量的滚动均值，**不含当天**（shift(1)），
      且至少需要 20 个有效观测，否则返回 NULL。
      等价 pandas: x.shift(1).rolling(window=30, min_periods=20).mean()
      对应客户口径 Avg_Vol_30_Pre。用于成交量异常检测，
      如 SIVOL > avg_vol_30d * 3。
    code: |
      # 先用旧 buffer 算出 avg_vol（不含当天）
      if vol_count >= 20:
          avg_vol = vol_sum / vol_count
      else:
          avg_vol = None

      # 计算之后再把当天 vol 推入 buffer（保证 shift(1) 语义）
      vol_buf.append(vol)
      if vol is not None:
          vol_sum += vol; vol_count += 1
      if len(vol_buf) > 30:
          old = vol_buf.popleft()
          if old is not None:
              vol_sum -= old; vol_count -= 1
    source: scripts/02_import_data.sh#L417-L432
