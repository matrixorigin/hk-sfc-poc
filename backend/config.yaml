server:
  port: ${SERVER_PORT}
  static_dir: "${STATIC_DIR}"

catalog:
  url: "${CATALOG_URL}"
  api_key: "${MOI_SYSTEM_API_KEY}"
  workspace_id: "${POC_WORKSPACE_ID}"

jobs:
  ccass:
    enabled: true         # 设为 true 启用 CCASS 定时爬取
    schedule: "20:00"     # 每天执行时间 (HH:MM)
    top: 200              # 爬取前 N 只股票，0 = 全量
    script: "scripts/cron_ccass.sh"

explore:
  db_name: "hk_sfc"
  tables:
    - ms_t_stk_hsi
    - ms_v_stk_hsi_daily
    - ms_t_stk_sis
    - ms_v_stock_capital
    - ds_t_int_hsicl_dtl
    - sehknews
    - profit_loss
    - ccass_holdings
  planning_mode: "auto"
  verbose: "steps"
  llm_model: "qwen3-max"
  knowledge_base_id: 10001
